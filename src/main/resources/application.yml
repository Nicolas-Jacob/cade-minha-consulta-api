# Porta do servidor. No Azure App Service (Linux, Java SE) a plataforma informa a porta na variavel PORT.
# Localmente, sem PORT, fica 8080.
server:
  port: ${PORT:8080}

spring:
  application:
    name: cademinhaconsulta

  # Le as variaveis do arquivo .env (se existir) na raiz do projeto
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    # O schema vem dos scripts em /scripts. O Hibernate nunca cria ou altera tabelas.
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false

  # Local (docker compose): porta 5672, vhost /, sem SSL.
  # CloudAMQP: porta 5671, vhost da instancia e RABBITMQ_SSL=true.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL:false}
    listener:
      simple:
        # Mensagem com erro e descartada, nunca volta para a fila (sem reprocessar em loop)
        default-requeue-rejected: false

  ai:
    openai:
      # Placeholder apenas para a aplicacao subir sem chave configurada (nao e credencial)
      api-key: ${AI_API_KEY:nao-configurada}
      base-url: ${AI_BASE_URL:https://api.openai.com/v1}
      # O OrientacaoService ja limita a chamada a orientacao.timeout-segundos e cai no texto padrao;
      # sem novas tentativas, para a resposta nao passar desse limite
      timeout: 20s
      max-retries: 0
      chat:
        options:
          model: ${AI_MODEL:gpt-4o-mini}

# Orientacoes da consulta (Spring AI): passado esse tempo, devolve o texto padrao (origem PADRAO)
orientacao:
  timeout-segundos: 20

# Modelo de ML de risco de falta. Vazio = StubRiscoFaltaClient (risco e nivel null)
risco-falta:
  url: ${RISCO_FALTA_URL:}

jwt:
  secret: ${JWT_SECRET}
  expiration-seconds: 28800

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
  # O health reflete so o banco. A API funciona sem o broker (o cancelamento continua valendo e so a
  # realocacao automatica da vaga para), entao o RabbitMQ fica fora: uma queda do broker nao deve
  # marcar a instancia como doente no health check do Azure App Service e provocar reinicios.
  health:
    rabbit:
      enabled: false
