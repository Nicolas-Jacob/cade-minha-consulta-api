# Porta do servidor. No Azure App Service (Linux, Java SE) a plataforma informa a porta na variavel PORT.
# Localmente, sem PORT, fica 8080.
server:
  port: ${PORT:8080}

spring:
  application:
    name: cademinhaconsulta

  # Le as variaveis do arquivo .env (se existir) na raiz do projeto
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    # O Oracle da FIAP fecha conexoes ociosas (ORA-17008: Closed connection). As conexoes do pool sao
    # renovadas antes disso e as ociosas recebem um ping periodico.
    hikari:
      max-lifetime: 300000    # 5 min: tempo maximo de vida de cada conexao
      idle-timeout: 120000    # 2 min: fecha conexoes ociosas acima do minimum-idle
      keepalive-time: 60000   # 1 min: ping nas conexoes ociosas (precisa ser menor que o max-lifetime)
      # Sem isto o minimum-idle e igual ao maximum-pool-size (10) e o Hikari ignora o idle-timeout
      minimum-idle: 2

  jpa:
    # O schema vem dos scripts em /scripts. O Hibernate nunca cria ou altera tabelas.
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false

  # Local (docker compose): porta 5672, vhost /, sem SSL.
  # CloudAMQP: porta 5671, vhost da instancia e RABBITMQ_SSL=true.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL:false}
    listener:
      simple:
        # Mensagem com erro e descartada, nunca volta para a fila (sem reprocessar em loop)
        default-requeue-rejected: false

  ai:
    openai:
      # Placeholder apenas para a aplicacao subir sem chave configurada (nao e credencial)
      api-key: ${AI_API_KEY:nao-configurada}
      base-url: ${AI_BASE_URL:https://api.openai.com/v1}
      # O OrientacaoService ja limita a chamada a orientacao.timeout-segundos e cai no texto padrao;
      # sem novas tentativas, para a resposta nao passar desse limite
      timeout: 20s
      max-retries: 0
      chat:
        options:
          model: ${AI_MODEL:gpt-4o-mini}

# Orientacoes da consulta (Spring AI): passado esse tempo, devolve o texto padrao (origem PADRAO)
orientacao:
  timeout-segundos: 20

# Servico de risco de falta (vaga-certa-ia, FastAPI). Localmente roda em http://localhost:8000.
# url vazia = StubRiscoFaltaClient (risco e nivel null); preenchida = HttpRiscoFaltaClient.
# token: enviado no header X-Service-Token so se preenchido. Em qualquer falha, risco e nivel null (endpoint 200).
risco-falta:
  url: ${RISCO_FALTA_URL:}
  token: ${RISCO_FALTA_TOKEN:}
  connect-timeout-ms: ${RISCO_FALTA_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${RISCO_FALTA_READ_TIMEOUT_MS:15000}

jwt:
  secret: ${JWT_SECRET}
  expiration-seconds: 28800

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
  # O health reflete so o banco. A API funciona sem o broker (o cancelamento continua valendo e so a
  # realocacao automatica da vaga para), entao o RabbitMQ fica fora: uma queda do broker nao deve
  # marcar a instancia como doente no health check do Azure App Service e provocar reinicios.
  health:
    rabbit:
      enabled: false
